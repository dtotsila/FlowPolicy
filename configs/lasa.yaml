project_name: "lasa_multitask_pure_vision"

dataset:
  name: "multitask_lasa"
  pattern_names: ["GShape", "Sine", "Angle"]
  train_indices: [0, 1, 2, 3]
  val_indices: [4]
  test_indices: [5, 6]
  chunk_size: 8
  action_dim: 6
  state_dim: 6
  use_velocity: true
  use_acceleration: true
  use_vision: true
  hdf5_path: "data/lasa_vision.hdf5"

model:
  hidden_dim: 256
  num_layers: 8
  num_heads: 8
  # num_classes: 3

training:
  batch_size: 256
  epochs: 1000
  lr: 1.e-4
  device: "cuda"
  weight_decay: 0.
  save_every: 20

inference:
  sampling_steps: 10
  k_step: 4